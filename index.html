<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<title>Prędkościomierz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@600;700&family=Orbitron:wght@700;800&family=Rajdhani:wght@600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171c;
    --panel: #1b1f27;
    --panel-edge: #262b35;
    --ink: #eef0f2;
    --ink-dim: #8b93a1;
    --amber: #e8a33d;
    --teal: #5fb8ae;
    --danger: #c1440e;
    --danger-press: #9c360a;
    --scale: 1;
  }

  html[data-theme="slate"] {
    --bg: #12151b;
    --panel: #1a1f29;
    --panel-edge: #262d3a;
    --ink: #e9ecf2;
    --ink-dim: #8891a3;
    --amber: #7fa3c9;
    --teal: #c2a878;
    --danger: #a8552f;
    --danger-press: #874428;
  }

  html[data-theme="forest"] {
    --bg: #12160f;
    --panel: #191f16;
    --panel-edge: #262e20;
    --ink: #ecefe6;
    --ink-dim: #8b9483;
    --amber: #93ae7c;
    --teal: #cba25c;
    --danger: #a3502f;
    --danger-press: #834025;
  }

  html[data-theme="plum"] {
    --bg: #170f14;
    --panel: #201319;
    --panel-edge: #2e1c25;
    --ink: #f1e9ec;
    --ink-dim: #9c8791;
    --amber: #c98a9a;
    --teal: #c9a24f;
    --danger: #973342;
    --danger-press: #7a2835;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 18px 6px 22px;
    gap: 10px;
  }

  .top-bar .status {
    font-size: 13px;
    color: var(--ink-dim);
    letter-spacing: 0.02em;
    flex: 1;
    min-width: 0;
  }

  .top-bar .status.live::before {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--amber);
    margin-right: 7px;
    box-shadow: 0 0 6px var(--amber);
    animation: pulse 1.6s ease-in-out infinite;
    vertical-align: middle;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .top-bar .right-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .elapsed {
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    color: var(--ink-dim);
    margin-right: 4px;
  }

  .pref-btn {
    appearance: none;
    border: 1px solid var(--panel-edge);
    background: var(--panel);
    color: var(--ink-dim);
    font-size: 12px;
    font-weight: 600;
    border-radius: 8px;
    padding: 5px 8px;
    line-height: 1;
    opacity: 0.75;
  }

  .pref-btn:active {
    opacity: 1;
    transform: scale(0.95);
  }

  .swatch-btn {
    padding: 5px;
  }

  .swatch-dot {
    display: block;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 8px 18px 18px;
  }

  .gauge {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    min-height: 0;
  }

  .gauge .label {
    position: absolute;
    top: 18px;
    left: 22px;
    font-size: 14px;
    color: var(--ink-dim);
    font-weight: 500;
  }

  .gauge .value {
    font-variant-numeric: tabular-nums;
    font-family: var(--num-font, ui-monospace, "SF Mono", Menlo, monospace);
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .gauge .unit {
    font-size: 15px;
    color: var(--ink-dim);
    margin-top: 6px;
    font-weight: 500;
  }

  .gauge--current .value {
    font-size: calc(clamp(72px, 26vw, 140px) * var(--scale));
    color: var(--amber);
  }

  .gauge--average {
    flex: 0 0 34%;
  }

  .gauge--average .value {
    font-size: calc(clamp(46px, 15vw, 80px) * var(--scale));
    color: var(--teal);
  }

  .distance-note {
    position: absolute;
    bottom: 16px;
    right: 20px;
    font-size: 12px;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }

  .reset-btn {
    appearance: none;
    border: none;
    border-radius: 18px;
    background: var(--danger);
    color: #fff;
    font-size: 19px;
    font-weight: 600;
    padding: 18px;
    letter-spacing: 0.01em;
    transition: background 0.12s ease, transform 0.08s ease;
  }

  .reset-btn:active {
    background: var(--danger-press);
    transform: scale(0.98);
  }

  .reset-btn:disabled {
    opacity: 0.35;
  }

  .start-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 40px;
    text-align: center;
    z-index: 10;
  }

  .start-overlay .lang-row {
    position: absolute;
    top: calc(18px + env(safe-area-inset-top));
    right: 20px;
    display: flex;
    gap: 6px;
  }

  .start-overlay h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0;
  }

  .start-overlay p {
    font-size: 15px;
    color: var(--ink-dim);
    margin: 0;
    max-width: 320px;
    line-height: 1.5;
  }

  .start-btn {
    appearance: none;
    border: none;
    border-radius: 18px;
    background: var(--amber);
    color: #1a1400;
    font-size: 19px;
    font-weight: 700;
    padding: 18px 42px;
  }

  .start-btn:active { transform: scale(0.98); }

  .error-msg {
    color: var(--danger);
    font-size: 14px;
    max-width: 300px;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

  <div class="start-overlay" id="startOverlay">
    <div class="lang-row">
      <button class="pref-btn" id="langBtnOverlay">PL</button>
    </div>
    <h1 id="titleText">Prędkościomierz GPS</h1>
    <p id="descText">Pokazuje aktualną prędkość i średnią prędkość na podstawie sygnału GPS. Trzymaj telefon w pobliżu okna dla lepszego odbioru.</p>
    <button class="start-btn" id="startBtn">Rozpocznij pomiar</button>
    <p class="error-msg hidden" id="errorMsg"></p>
  </div>

  <div class="top-bar">
    <span class="status" id="statusText">Oczekiwanie na GPS…</span>
    <div class="right-controls">
      <span class="elapsed" id="elapsedText">00:00</span>
      <button class="pref-btn" id="fontBtn" title="Rozmiar czcionki">Aa</button>
      <button class="pref-btn" id="fontFamilyBtn" title="Krój czcionki">Ff</button>
      <button class="pref-btn swatch-btn" id="themeBtn" title="Motyw kolorystyczny"><span class="swatch-dot" id="themeDot"></span></button>
      <button class="pref-btn" id="langBtn">PL</button>
    </div>
  </div>

  <main>
    <div class="gauge gauge--current">
      <span class="label" id="labelCurrent">Prędkość</span>
      <span class="value" id="currentSpeed">0</span>
      <span class="unit">km/h</span>
    </div>

    <div class="gauge gauge--average">
      <span class="label" id="labelAverage">Średnia</span>
      <span class="value" id="avgSpeed">0</span>
      <span class="unit">km/h</span>
      <span class="distance-note" id="distanceNote">0.00 km</span>
    </div>

    <button class="reset-btn" id="resetBtn" disabled>Zeruj średnią</button>
  </main>

<script>
(function () {
  // ---------- Translations ----------
  const STRINGS = {
    pl: {
      title: 'Prędkościomierz GPS',
      desc: 'Pokazuje aktualną prędkość i średnią prędkość na podstawie sygnału GPS. Trzymaj telefon w pobliżu okna dla lepszego odbioru.',
      start: 'Rozpocznij pomiar',
      waiting: 'Oczekiwanie na GPS…',
      live: 'Sygnał GPS aktywny',
      current: 'Prędkość',
      average: 'Średnia',
      reset: 'Zeruj średnią',
      permDenied: 'Brak zgody na dostęp do lokalizacji.',
      timeout: 'Przekroczono czas oczekiwania na sygnał GPS.',
      generic: 'Nie udało się pobrać lokalizacji.',
      unsupported: 'Ta przeglądarka nie obsługuje lokalizacji GPS.'
    },
    en: {
      title: 'GPS Speedometer',
      desc: 'Shows your current speed and average speed based on GPS. Keep the phone near a window for better reception.',
      start: 'Start measuring',
      waiting: 'Waiting for GPS…',
      live: 'GPS signal active',
      current: 'Speed',
      average: 'Average',
      reset: 'Reset average',
      permDenied: 'Location access was denied.',
      timeout: 'Timed out waiting for a GPS signal.',
      generic: 'Could not get your location.',
      unsupported: 'This browser does not support GPS location.'
    },
    de: {
      title: 'GPS-Tacho',
      desc: 'Zeigt deine aktuelle Geschwindigkeit und Durchschnittsgeschwindigkeit per GPS an. Halte das Telefon für besseren Empfang nahe an einem Fenster.',
      start: 'Messung starten',
      waiting: 'Warte auf GPS…',
      live: 'GPS-Signal aktiv',
      current: 'Geschwindigkeit',
      average: 'Durchschnitt',
      reset: 'Durchschnitt zurücksetzen',
      permDenied: 'Zugriff auf den Standort wurde verweigert.',
      timeout: 'Zeitüberschreitung beim Warten auf GPS-Signal.',
      generic: 'Standort konnte nicht ermittelt werden.',
      unsupported: 'Dieser Browser unterstützt keine GPS-Standortbestimmung.'
    },
    es: {
      title: 'Velocímetro GPS',
      desc: 'Muestra tu velocidad actual y la velocidad media según el GPS. Mantén el teléfono cerca de una ventana para mejor recepción.',
      start: 'Iniciar medición',
      waiting: 'Esperando señal GPS…',
      live: 'Señal GPS activa',
      current: 'Velocidad',
      average: 'Media',
      reset: 'Reiniciar media',
      permDenied: 'Se denegó el acceso a la ubicación.',
      timeout: 'Se agotó el tiempo esperando señal GPS.',
      generic: 'No se pudo obtener la ubicación.',
      unsupported: 'Este navegador no admite la ubicación GPS.'
    }
  };
  const LANG_ORDER = ['pl', 'en', 'de', 'es'];
  const SIZE_ORDER = [0.8, 1, 1.25];
  const THEMES = [
    { key: 'amber',  a: '#e8a33d', b: '#5fb8ae' },
    { key: 'slate',  a: '#7fa3c9', b: '#c2a878' },
    { key: 'forest', a: '#93ae7c', b: '#cba25c' },
    { key: 'plum',   a: '#c98a9a', b: '#c9a24f' }
  ];
  const FONTS = [
    { label: 'Domyślna', stack: 'ui-monospace, "SF Mono", Menlo, monospace' },
    { label: 'JetBrains Mono', stack: '"JetBrains Mono", ui-monospace, monospace' },
    { label: 'Space Mono', stack: '"Space Mono", ui-monospace, monospace' },
    { label: 'Orbitron', stack: '"Orbitron", sans-serif' },
    { label: 'Rajdhani', stack: '"Rajdhani", sans-serif' },
    { label: 'Archivo Black', stack: '"Archivo Black", sans-serif' }
  ];

  let lang = localStorage.getItem('speedo_lang') || 'pl';
  if (!STRINGS[lang]) lang = 'pl';
  let sizeIndex = parseInt(localStorage.getItem('speedo_size_idx'), 10);
  if (isNaN(sizeIndex) || sizeIndex < 0 || sizeIndex >= SIZE_ORDER.length) sizeIndex = 1;
  let themeIndex = parseInt(localStorage.getItem('speedo_theme_idx'), 10);
  if (isNaN(themeIndex) || themeIndex < 0 || themeIndex >= THEMES.length) themeIndex = 0;
  let fontIndex = parseInt(localStorage.getItem('speedo_font_idx'), 10);
  if (isNaN(fontIndex) || fontIndex < 0 || fontIndex >= FONTS.length) fontIndex = 0;

  // ---------- Elements ----------
  const startOverlay = document.getElementById('startOverlay');
  const startBtn = document.getElementById('startBtn');
  const errorMsg = document.getElementById('errorMsg');
  const statusText = document.getElementById('statusText');
  const elapsedText = document.getElementById('elapsedText');
  const currentSpeedEl = document.getElementById('currentSpeed');
  const avgSpeedEl = document.getElementById('avgSpeed');
  const distanceNoteEl = document.getElementById('distanceNote');
  const resetBtn = document.getElementById('resetBtn');
  const titleText = document.getElementById('titleText');
  const descText = document.getElementById('descText');
  const labelCurrent = document.getElementById('labelCurrent');
  const labelAverage = document.getElementById('labelAverage');
  const fontBtn = document.getElementById('fontBtn');
  const fontFamilyBtn = document.getElementById('fontFamilyBtn');
  const langBtn = document.getElementById('langBtn');
  const langBtnOverlay = document.getElementById('langBtnOverlay');
  const themeBtn = document.getElementById('themeBtn');
  const themeDot = document.getElementById('themeDot');

  let isLive = false;
  let lastErrorKey = null;

  function applyLanguage() {
    const t = STRINGS[lang];
    titleText.textContent = t.title;
    descText.textContent = t.desc;
    startBtn.textContent = t.start;
    labelCurrent.textContent = t.current;
    labelAverage.textContent = t.average;
    resetBtn.textContent = t.reset;
    langBtn.textContent = lang.toUpperCase();
    langBtnOverlay.textContent = lang.toUpperCase();
    if (!isLive) {
      statusText.textContent = lastErrorKey ? t[lastErrorKey] : t.waiting;
    } else {
      statusText.textContent = t.live;
    }
    localStorage.setItem('speedo_lang', lang);
  }

  function applySize() {
    document.documentElement.style.setProperty('--scale', SIZE_ORDER[sizeIndex]);
    localStorage.setItem('speedo_size_idx', String(sizeIndex));
  }

  function cycleLang() {
    const idx = LANG_ORDER.indexOf(lang);
    lang = LANG_ORDER[(idx + 1) % LANG_ORDER.length];
    applyLanguage();
  }

  function cycleSize() {
    sizeIndex = (sizeIndex + 1) % SIZE_ORDER.length;
    applySize();
  }

  function applyTheme() {
    const t = THEMES[themeIndex];
    document.documentElement.setAttribute('data-theme', t.key);
    themeDot.style.background = 'linear-gradient(135deg, ' + t.a + ' 50%, ' + t.b + ' 50%)';
    localStorage.setItem('speedo_theme_idx', String(themeIndex));
  }

  function cycleTheme() {
    themeIndex = (themeIndex + 1) % THEMES.length;
    applyTheme();
  }

  function applyFontFamily() {
    document.documentElement.style.setProperty('--num-font', FONTS[fontIndex].stack);
    localStorage.setItem('speedo_font_idx', String(fontIndex));
  }

  function cycleFontFamily() {
    fontIndex = (fontIndex + 1) % FONTS.length;
    applyFontFamily();
  }

  langBtn.addEventListener('click', cycleLang);
  langBtnOverlay.addEventListener('click', cycleLang);
  fontBtn.addEventListener('click', cycleSize);
  fontFamilyBtn.addEventListener('click', cycleFontFamily);
  themeBtn.addEventListener('click', cycleTheme);

  applyLanguage();
  applySize();
  applyTheme();
  applyFontFamily();

  // ---------- Geolocation logic ----------
  let watchId = null;
  let lastFix = null;
  let totalDistanceKm = 0;
  let sessionStartMs = null;
  let lastGoodSpeedKmh = 0;

  function haversineKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function formatElapsed(ms) {
    const totalSec = Math.floor(ms / 1000);
    const m = String(Math.floor(totalSec / 60)).padStart(2, '0');
    const s = String(totalSec % 60).padStart(2, '0');
    return m + ':' + s;
  }

  function resetSession() {
    lastFix = null;
    totalDistanceKm = 0;
    sessionStartMs = Date.now();
    lastGoodSpeedKmh = 0;
    avgSpeedEl.textContent = '0';
    distanceNoteEl.textContent = '0.00 km';
    elapsedText.textContent = '00:00';
  }

  function handlePosition(pos) {
    const { latitude, longitude, speed } = pos.coords;
    const now = Date.now();

    isLive = true;
    lastErrorKey = null;
    statusText.textContent = STRINGS[lang].live;
    statusText.classList.add('live');
    resetBtn.disabled = false;

    let currentKmh = null;
    if (speed !== null && speed !== undefined && !Number.isNaN(speed)) {
      currentKmh = speed * 3.6;
    }

    if (lastFix) {
      const dtSec = (now - lastFix.t) / 1000;
      if (dtSec > 0.3) {
        const segmentKm = haversineKm(lastFix.lat, lastFix.lon, latitude, longitude);
        const impliedKmh = (segmentKm / dtSec) * 3600;
        if (impliedKmh < 250) {
          totalDistanceKm += segmentKm;
          if (currentKmh === null) currentKmh = impliedKmh;
        }
      }
    } else {
      sessionStartMs = sessionStartMs || now;
    }

    lastFix = { lat: latitude, lon: longitude, t: now };

    if (currentKmh !== null) {
      lastGoodSpeedKmh = Math.max(0, currentKmh);
    }
    currentSpeedEl.textContent = lastGoodSpeedKmh.toFixed(0);

    const elapsedMs = now - (sessionStartMs || now);
    const elapsedHours = elapsedMs / 3600000;
    const avgKmh = elapsedHours > 0 ? totalDistanceKm / elapsedHours : 0;
    avgSpeedEl.textContent = avgKmh.toFixed(1);
    distanceNoteEl.textContent = totalDistanceKm.toFixed(2) + ' km';
    elapsedText.textContent = formatElapsed(elapsedMs);
  }

  function handleError(err) {
    isLive = false;
    let key = 'generic';
    if (err.code === err.PERMISSION_DENIED) key = 'permDenied';
    else if (err.code === err.TIMEOUT) key = 'timeout';
    lastErrorKey = key;
    statusText.textContent = STRINGS[lang][key];
    statusText.classList.remove('live');
  }

  function startTracking() {
    if (!('geolocation' in navigator)) {
      errorMsg.textContent = STRINGS[lang].unsupported;
      errorMsg.classList.remove('hidden');
      return;
    }
    resetSession();
    startOverlay.classList.add('hidden');
    watchId = navigator.geolocation.watchPosition(handlePosition, handleError, {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 15000
    });
  }

  startBtn.addEventListener('click', startTracking);
  resetBtn.addEventListener('click', resetSession);

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && watchId !== null) {
      lastFix = null;
    }
  });
})();
</script>
</body>
</html>
