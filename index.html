<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<title>Prędkościomierz</title>
<style>
  :root {
    --bg: #14171c;
    --panel: #1b1f27;
    --panel-edge: #262b35;
    --ink: #eef0f2;
    --ink-dim: #8b93a1;
    --amber: #e8a33d;
    --teal: #5fb8ae;
    --danger: #c1440e;
    --danger-press: #9c360a;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 22px 6px;
  }

  .top-bar .status {
    font-size: 13px;
    color: var(--ink-dim);
    letter-spacing: 0.02em;
  }

  .top-bar .status.live::before {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--amber);
    margin-right: 7px;
    box-shadow: 0 0 6px var(--amber);
    animation: pulse 1.6s ease-in-out infinite;
    vertical-align: middle;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .top-bar .elapsed {
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    color: var(--ink-dim);
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 8px 18px 18px;
  }

  .gauge {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    min-height: 0;
  }

  .gauge .label {
    position: absolute;
    top: 18px;
    left: 22px;
    font-size: 14px;
    color: var(--ink-dim);
    font-weight: 500;
  }

  .gauge .value {
    font-variant-numeric: tabular-nums;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .gauge .unit {
    font-size: 15px;
    color: var(--ink-dim);
    margin-top: 6px;
    font-weight: 500;
  }

  .gauge--current .value {
    font-size: clamp(64px, 22vw, 118px);
    color: var(--amber);
  }

  .gauge--average {
    flex: 0 0 34%;
  }

  .gauge--average .value {
    font-size: clamp(40px, 13vw, 68px);
    color: var(--teal);
  }

  .distance-note {
    position: absolute;
    bottom: 16px;
    right: 20px;
    font-size: 12px;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }

  .reset-btn {
    appearance: none;
    border: none;
    border-radius: 18px;
    background: var(--danger);
    color: #fff;
    font-size: 19px;
    font-weight: 600;
    padding: 18px;
    letter-spacing: 0.01em;
    transition: background 0.12s ease, transform 0.08s ease;
  }

  .reset-btn:active {
    background: var(--danger-press);
    transform: scale(0.98);
  }

  .reset-btn:disabled {
    opacity: 0.35;
  }

  .start-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 40px;
    text-align: center;
    z-index: 10;
  }

  .start-overlay h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0;
  }

  .start-overlay p {
    font-size: 15px;
    color: var(--ink-dim);
    margin: 0;
    max-width: 320px;
    line-height: 1.5;
  }

  .start-btn {
    appearance: none;
    border: none;
    border-radius: 18px;
    background: var(--amber);
    color: #1a1400;
    font-size: 19px;
    font-weight: 700;
    padding: 18px 42px;
  }

  .start-btn:active { transform: scale(0.98); }

  .error-msg {
    color: var(--danger);
    font-size: 14px;
    max-width: 300px;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

  <div class="start-overlay" id="startOverlay">
    <h1>Prędkościomierz GPS</h1>
    <p>Pokazuje aktualną prędkość i średnią prędkość na podstawie sygnału GPS. Trzymaj telefon w pobliżu okna dla lepszego odbioru.</p>
    <button class="start-btn" id="startBtn">Rozpocznij pomiar</button>
    <p class="error-msg hidden" id="errorMsg"></p>
  </div>

  <div class="top-bar">
    <span class="status" id="statusText">Oczekiwanie na GPS…</span>
    <span class="elapsed" id="elapsedText">00:00</span>
  </div>

  <main>
    <div class="gauge gauge--current">
      <span class="label">Prędkość</span>
      <span class="value" id="currentSpeed">0</span>
      <span class="unit">km/h</span>
    </div>

    <div class="gauge gauge--average">
      <span class="label">Średnia</span>
      <span class="value" id="avgSpeed">0</span>
      <span class="unit">km/h</span>
      <span class="distance-note" id="distanceNote">0.00 km</span>
    </div>

    <button class="reset-btn" id="resetBtn" disabled>Zeruj średnią</button>
  </main>

<script>
(function () {
  const startOverlay = document.getElementById('startOverlay');
  const startBtn = document.getElementById('startBtn');
  const errorMsg = document.getElementById('errorMsg');
  const statusText = document.getElementById('statusText');
  const elapsedText = document.getElementById('elapsedText');
  const currentSpeedEl = document.getElementById('currentSpeed');
  const avgSpeedEl = document.getElementById('avgSpeed');
  const distanceNoteEl = document.getElementById('distanceNote');
  const resetBtn = document.getElementById('resetBtn');

  let watchId = null;
  let lastFix = null;
  let totalDistanceKm = 0;
  let sessionStartMs = null;
  let lastGoodSpeedKmh = 0;

  function haversineKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function formatElapsed(ms) {
    const totalSec = Math.floor(ms / 1000);
    const m = String(Math.floor(totalSec / 60)).padStart(2, '0');
    const s = String(totalSec % 60).padStart(2, '0');
    return m + ':' + s;
  }

  function resetSession() {
    lastFix = null;
    totalDistanceKm = 0;
    sessionStartMs = Date.now();
    lastGoodSpeedKmh = 0;
    avgSpeedEl.textContent = '0';
    distanceNoteEl.textContent = '0.00 km';
    elapsedText.textContent = '00:00';
  }

  function handlePosition(pos) {
    const { latitude, longitude, speed } = pos.coords;
    const now = Date.now();

    statusText.textContent = 'Sygnał GPS aktywny';
    statusText.classList.add('live');
    resetBtn.disabled = false;

    let currentKmh = null;
    if (speed !== null && speed !== undefined && !Number.isNaN(speed)) {
      currentKmh = speed * 3.6;
    }

    if (lastFix) {
      const dtSec = (now - lastFix.t) / 1000;
      if (dtSec > 0.3) {
        const segmentKm = haversineKm(lastFix.lat, lastFix.lon, latitude, longitude);
        const impliedKmh = (segmentKm / dtSec) * 3600;
        if (impliedKmh < 250) {
          totalDistanceKm += segmentKm;
          if (currentKmh === null) currentKmh = impliedKmh;
        }
      }
    } else {
      sessionStartMs = sessionStartMs || now;
    }

    lastFix = { lat: latitude, lon: longitude, t: now };

    if (currentKmh !== null) {
      lastGoodSpeedKmh = Math.max(0, currentKmh);
    }
    currentSpeedEl.textContent = lastGoodSpeedKmh.toFixed(0);

    const elapsedMs = now - (sessionStartMs || now);
    const elapsedHours = elapsedMs / 3600000;
    const avgKmh = elapsedHours > 0 ? totalDistanceKm / elapsedHours : 0;
    avgSpeedEl.textContent = avgKmh.toFixed(1);
    distanceNoteEl.textContent = totalDistanceKm.toFixed(2) + ' km';
    elapsedText.textContent = formatElapsed(elapsedMs);
  }

  function handleError(err) {
    let msg = 'Nie udało się pobrać lokalizacji.';
    if (err.code === err.PERMISSION_DENIED) {
      msg = 'Brak zgody na dostęp do lokalizacji.';
    } else if (err.code === err.TIMEOUT) {
      msg = 'Przekroczono czas oczekiwania na sygnał GPS.';
    }
    statusText.textContent = msg;
    statusText.classList.remove('live');
  }

  function startTracking() {
    if (!('geolocation' in navigator)) {
      errorMsg.textContent = 'Ta przeglądarka nie obsługuje lokalizacji GPS.';
      errorMsg.classList.remove('hidden');
      return;
    }
    resetSession();
    startOverlay.classList.add('hidden');
    watchId = navigator.geolocation.watchPosition(handlePosition, handleError, {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 15000
    });
  }

  startBtn.addEventListener('click', startTracking);
  resetBtn.addEventListener('click', resetSession);

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && watchId !== null) {
      lastFix = null;
    }
  });
})();
</script>
</body>
</html>
